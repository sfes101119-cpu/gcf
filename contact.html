<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聯絡我們 - GCF</title>
    <style>
        :root { --paper-bg: #f5f4ef; --ink-magenta: #e94e8f; --ink-cyan: #26b2cc; --ink-yellow: #f8df1c; --ink-darkblue: #3d3e8e; --ink-black: #2a2a2a; }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang TC', '微軟正黑體', sans-serif;
            color: var(--ink-black); background-color: var(--paper-bg);
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.06'/%3E%3C/svg%3E");
            line-height: 1.8;
        }
        .top-bar { background-color: var(--ink-black); color: #fff; font-size: 0.85em; padding: 8px 5%; display: flex; justify-content: flex-end; align-items: center; gap: 15px; }
        .top-bar a { color: #ddd; text-decoration: none; transition: color 0.2s; letter-spacing: 1px; }
        .top-bar a:hover { color: var(--ink-yellow); }
        .top-bar span { color: #777; font-size: 0.8em; }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: rgba(245, 244, 239, 0.95); backdrop-filter: blur(5px); position: sticky; top: 0; z-index: 100; border-bottom: 2px solid var(--ink-black); }
        .logo { font-size: 1.5em; font-weight: 900; text-decoration: none; color: var(--ink-black); display: flex; align-items: center; gap: 10px; }
        nav ul { list-style: none; display: flex; gap: 30px; margin: 0; padding: 0; }
        nav a { text-decoration: none; color: var(--ink-black); font-weight: bold; position: relative; padding-bottom: 5px; }
        nav a::after { content: ''; position: absolute; width: 100%; height: 4px; bottom: 0; left: 0; background-color: var(--ink-yellow); transform: scaleX(0); transform-origin: right; transition: transform 0.3s ease; mix-blend-mode: multiply; }
        nav a:hover::after { transform: scaleX(1); transform-origin: left; }
        .print-glitch { position: relative; display: inline-block; font-weight: 900; color: var(--ink-black); z-index: 2; }
        .print-glitch::before, .print-glitch::after { content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 0.3s ease, transform 0.3s ease; z-index: -1; mix-blend-mode: multiply; }
        .print-glitch:hover::before { opacity: 0.9; transform: translate(-4px, -3px); color: var(--ink-cyan); }
        .print-glitch:hover::after { opacity: 0.9; transform: translate(4px, 3px); color: var(--ink-magenta); }

        .page-header {
            padding: 100px 5% 80px; text-align: center; border-bottom: 5px solid var(--ink-black); position: relative;
            background-image: url('https://images.unsplash.com/photo-1596524430615-b46475ddff6e?q=80&w=1920&auto=format&fit=crop');
            background-size: cover; background-position: center; background-attachment: fixed;
        }
        .page-header::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(250, 248, 245, 0.9); z-index: 1; }
        .page-header h1 { font-size: 3.5em; margin: 0 0 10px 0; position: relative; z-index: 2; }
        .page-header p { font-size: 1.2em; position: relative; z-index: 2; color: #444; }

        section { padding: 80px 3%; margin: 0 auto; max-width: 1200px; }
        .section-title { font-size: 2.2em; margin-bottom: 40px; font-weight: 900; border-left: 8px solid var(--ink-yellow); padding-left: 15px; }

        .contact-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px; }

        .info-box { background: var(--paper-bg); border: 2px solid var(--ink-black); padding: 40px; position: relative; }
        .info-box::before { content: ''; position: absolute; top: 12px; left: 12px; width: 100%; height: 100%; background: var(--ink-cyan); border: 2px solid var(--ink-black); z-index: -1; }
        .info-box.magenta-shadow::before { background: var(--ink-magenta); }
        .info-box h3 { font-size: 1.8em; margin-top: 0; border-bottom: 2px dashed var(--ink-black); padding-bottom: 10px; }

        .contact-info p { font-size: 1.15em; margin-bottom: 20px; }
        .contact-info strong { display: block; color: var(--ink-magenta); font-size: 0.9em; text-transform: uppercase; letter-spacing: 1px; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 8px; color: var(--ink-black); }
        .form-group input, .form-group textarea {
            width: 100%; padding: 12px; border: 2px solid var(--ink-black); background: #fff; font-family: inherit; font-size: 1em; transition: all 0.3s;
        }
        .form-group input:focus, .form-group textarea:focus { outline: none; box-shadow: 4px 4px 0px var(--ink-yellow); }

        .submit-btn {
            display: inline-block; width: 100%; padding: 15px; background: var(--ink-black); color: var(--paper-bg);
            text-decoration: none; font-size: 1.1em; font-weight: bold; border: 2px solid var(--ink-black);
            position: relative; transition: transform 0.2s; z-index: 2; cursor: pointer; text-align: center;
        }
        .submit-btn::after {
            content: ''; position: absolute; top: 6px; left: 6px; width: 100%; height: 100%;
            background: var(--ink-cyan); z-index: -1; transition: transform 0.2s, background 0.2s; border: 2px solid var(--ink-black);
        }
        .submit-btn:hover { transform: translate(3px, 3px); }
        .submit-btn:hover::after { transform: translate(-3px, -3px); background: var(--ink-magenta); }

        footer { background: var(--ink-black); color: #aaa; text-align: center; padding: 40px 20px; margin-top: 60px; border-top: 5px solid var(--ink-black); }
    </style>
</head>

<header class="page-header">
    <h1 class="print-glitch" data-text="聯絡我們">聯絡我們</h1>
    <p>有任何色彩認證或課程相關問題，歡迎隨時與我們聯繫！</p>
</header>

<section>
    <h2 class="section-title">與我們聯繫</h2>
    <div class="contact-container">

        <!-- 聯絡資訊區塊 -->
        <div class="info-box cyan-shadow contact-info">
            <h3>聯絡資訊</h3>
            <p><strong>聯絡窗口</strong>Mika</p>
            <p><strong>Email信箱</strong><a href="mailto:info@gcf.org.tw" style="color: var(--ink-black); text-decoration: underline; text-decoration-color: var(--ink-cyan); font-weight: bold;">info@gcf.org.tw</a></p>
            <p><strong>主辦單位</strong>X-Rite Pantone</p>
            <p><strong>執行單位</strong>印刷傳播興才文教基金會</p>
        </div>

        <!-- 聯絡表單區塊 -->
        <div class="info-box magenta-shadow">
            <h3>傳送訊息</h3>
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="name">您的姓名</label>
                    <input type="text" id="name" name="name" required placeholder="請輸入姓名">
                </div>
                <div class="form-group">
                    <label for="email">Email 信箱</label>
                    <input type="email" id="email" name="email" required placeholder="example@domain.com">
                </div>
                <div class="form-group">
                    <label for="subject">主旨</label>
                    <input type="text" id="subject" name="subject" required placeholder="請輸入主旨">
                </div>
                <div class="form-group">
                    <label for="message">訊息內容</label>
                    <textarea id="message" name="message" rows="5" required placeholder="請輸入您想詢問的內容..."></textarea>
                </div>
                <button type="submit" class="submit-btn">送出訊息</button>
            </form>
        </div>

    </div>
</section>

<footer>
    <p>主辦單位：X-Rite Pantone | 執行單位：印刷傳播興才文教基金會</p>
    <p>Copyright &copy; 2026 GCF All rights reserved.</p>
</footer>
